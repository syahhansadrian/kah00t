<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kahoot Clone - Kuis Interaktif</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;">

    <!-- LOGO -->
    <div class="text-center mb-2" style="animation: fadeIn 0.6s ease;">
      <div style="font-size:64px;margin-bottom:8px;">🎯</div>
      <h1 style="font-size:48px;font-weight:900;letter-spacing:-1px;">
        Quiz<span style="color:var(--orange);">Live</span>
      </h1>
      <p style="font-size:18px;opacity:0.7;margin-top:4px;">Kuis interaktif real-time tanpa batas pemain!</p>
    </div>

    <!-- MENU -->
    <div style="width:100%;max-width:400px;margin-top:40px;">

      <!-- JOIN GAME -->
      <a href="/play">
        <button class="btn btn-primary btn-lg btn-block mb-2" style="animation: slideUp 0.5s ease;">
          🎮 JOIN GAME
        </button>
      </a>

      <!-- CREATE GAME -->
      <a href="/admin">
        <button class="btn btn-white btn-lg btn-block" style="animation: slideUp 0.6s ease;">
          🛠️ BUAT KUIS
        </button>
      </a>

    </div>

    <!-- Features -->
    <div style="display:flex;gap:24px;margin-top:48px;opacity:0.6;font-size:14px;font-weight:600;animation: fadeIn 0.8s ease;">
      <span>⚡ Real-time</span>
      <span>👥 100+ Pemain</span>
      <span>🏆 Skor Fair</span>
      <span>📱 Mobile Friendly</span>
    </div>

  </div>
</body>
</html>
